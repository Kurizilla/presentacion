<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(vendor/fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Inter;src:url(vendor/fonts/Inter-Italic.ttf);font-weight:100 900;font-style:italic}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:Inter}
#s{position:relative;width:1920px;height:1080px;background:#fbfbfb;overflow:hidden}
.title{position:absolute;top:96px;left:0;right:0;text-align:center;font-size:54px;font-weight:700;color:#203d97;letter-spacing:-.5px}
.title .b{color:#4c7fff;font-weight:400;margin:0 18px}.title i{color:#4c7fff;font-weight:400}
.node{position:absolute;border-radius:50%;background:#fff;border:5px solid #3b82f6;box-shadow:0 22px 60px rgba(37,99,235,.16),0 0 0 14px rgba(59,130,246,.07);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.node img{object-fit:contain}
.pill{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;padding:12px 28px;border-radius:40px;background:linear-gradient(90deg,#1d4ed8,#4c7fff);color:#fff;font-weight:800;font-size:28px;letter-spacing:.6px;box-shadow:0 8px 24px rgba(37,99,235,.28);white-space:nowrap}
.pill small{font-size:18px;opacity:.7;font-weight:600}
.cap{position:absolute;transform:translate(-50%,0);font-size:24px;color:#676888;white-space:nowrap;text-align:center}
.tap{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid #3b82f6;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(37,99,235,.25)}
.tap svg{width:26px;height:26px;fill:none;stroke:#2563eb;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
svg.ring{position:absolute;inset:0}
</style></head><body><div id="s"></div>
<script>
const v=new URLSearchParams(location.search).get('v')||'A';const S=document.getElementById('s');
const ST=[['GENERAR','01','nimbo_bulb','Crear con IA'],['ENSEÑAR','02','boy','Aprender jugando'],['MEDIR','03','folder','Ver cada avance'],['ADAPTAR','04','nimbo_think','Apoyar a cada niño']];
const tapIc='<svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4.5 14a1.5 1.5 0 0 1 2.5-1.7L9 15"/></svg>';
const add=h=>S.insertAdjacentHTML('beforeend',h);
function arrowsRing(cx,cy,R,col,dash){let h=`<svg class="ring" viewBox="0 0 1920 1080"><defs><marker id="m" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker></defs>`;
 [[-135,-45],[-45,45],[45,135],[135,225]].forEach(([a,b])=>{const a1=(a+24)*Math.PI/180,a2=(b-24)*Math.PI/180;
 h+=`<path d="M${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)} A${R} ${R} 0 0 1 ${cx+R*Math.cos(a2)} ${cy+R*Math.sin(a2)}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${dash}" marker-end="url(#m)"/>`;});return h+'</svg>';}
const title='<div class="title">Cómo funciona la plataforma<span class="b">|</span><i>Un ciclo continuo</i></div>';
if(v==='A'){ // ring, like the original, side cards removed
 S.innerHTML=title;const cx=960,cy=600,R=300;add(arrowsRing(cx,cy+-20,R+40,'#93c5fd','2 16'));
 add(`<img src="assets/v3/nimbo_happy.png" style="position:absolute;left:${cx-140}px;top:${cy-200}px;width:280px">`);
 add(`<div style="position:absolute;left:0;right:0;top:${cy+50}px;text-align:center;font-size:58px;line-height:1.05;font-weight:900;color:#1c1e4d;letter-spacing:-1px">Plataforma<br>educativa</div>`);
 ST.forEach((s,i)=>{const a=[-135,-45,45,135][i]*Math.PI/180,x=[540,1380,1380,540][i],y=[370,370,790,790][i];
  add(`<div class="node" style="left:${x}px;top:${y}px;width:240px;height:240px"><img src="assets/v3/${s[2]}.png" style="width:180px;height:180px"></div>`);
  add(`<div class="pill" style="left:${x}px;top:${y+160}px">${s[0]}<small>${s[1]}</small></div>`);
  add(`<div class="tap" style="left:${x+95}px;top:${y+95}px">${tapIc}</div>`);});
}
if(v==='B'){ // horizontal journey with return arc
 S.innerHTML=title;const xs=[330,750,1170,1590],y=520;
 let h='<svg class="ring" viewBox="0 0 1920 1080"><defs><marker id="m" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker></defs>';
 for(let i=0;i<3;i++)h+=`<path d="M${xs[i]+165} ${y} H${xs[i+1]-170}" stroke="#93c5fd" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round" marker-end="url(#m)"/>`;
 h+=`<path d="M1590 820 C1590 960, 330 960, 330 830" fill="none" stroke="#93c5fd" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round" marker-end="url(#m)"/></svg>`;add(h);
 ST.forEach((s,i)=>{add(`<div class="node" style="left:${xs[i]}px;top:${y}px;width:290px;height:290px"><img src="assets/v3/${s[2]}.png" style="width:220px;height:220px"></div>`);
  add(`<div class="pill" style="left:${xs[i]}px;top:${y+215}px">${s[0]}<small>${s[1]}</small></div>`);
  add(`<div class="cap" style="left:${xs[i]}px;top:${y+262}px">${s[3]}</div>`);
  add(`<div class="tap" style="left:${xs[i]+108}px;top:${y+108}px">${tapIc}</div>`);});
 add(`<div style="position:absolute;left:0;right:0;top:952px;text-align:center"><span style="display:inline-flex;align-items:center;gap:14px;background:#fff;border:2px solid #e8e9ed;border-radius:40px;padding:10px 26px 10px 12px;font-size:24px;color:#1c1e4d;font-weight:600"><img src="assets/v3/nimbo_happy.png" style="width:56px">Plataforma educativa · cada ciclo vuelve a empezar</span></div>`);
}
if(v==='C'){ // dark hero, Nimbo at the centre
 S.style.background='linear-gradient(120deg,#1c1e4d 0%,#2a2c62 55%,#454764 100%)';
 S.innerHTML='<div class="title" style="color:#fff">Cómo funciona la plataforma<span class="b" style="color:#93c5fd">|</span><i style="color:#93c5fd">Un ciclo continuo</i></div>';
 const cx=960,cy=610,R=320;add(`<div style="position:absolute;left:${cx-260}px;top:${cy-260}px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,.35),rgba(96,165,250,0) 70%)"></div>`);
 add(arrowsRing(cx,cy,R,'rgba(147,197,253,.6)','2 16'));
 add(`<img src="assets/v3/nimbo_laugh.png" style="position:absolute;left:${cx-190}px;top:${cy-170}px;width:380px">`);
 ST.forEach((s,i)=>{const a=[-135,-45,45,135][i]*Math.PI/180,x=cx+R*1.7*Math.cos(a),y=cy+R*1.0*Math.sin(a);
  add(`<div class="node" style="left:${x}px;top:${y}px;width:240px;height:240px;border-color:#60a5fa;box-shadow:0 0 0 16px rgba(96,165,250,.14),0 0 70px rgba(96,165,250,.45)"><img src="assets/v3/${s[2]}.png" style="width:185px;height:185px"></div>`);
  add(`<div style="position:absolute;transform:translate(-50%,-50%);left:${x}px;top:${y+(i<2?-165:165)}px;color:#fff;font-weight:800;font-size:30px;letter-spacing:4px">${s[0]}</div>`);
  add(`<div class="tap" style="left:${x+90}px;top:${y+90}px">${tapIc}</div>`);});
}
</script></body></html>
